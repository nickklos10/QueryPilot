[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "querypilot"
version = "0.1.0"
description = "Safe SQL tool layer for AI agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.0",
  "pydantic>=2.0",
  "sqlalchemy>=2.0",
  "sqlglot>=25.0",
]

[project.optional-dependencies]
dev = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pytest>=8.0",
  "pyyaml>=6.0",
]
server = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
mcp = [
  "mcp>=1.0",
]
openai = [
  "openai>=1.0",
]
anthropic = [
  "anthropic>=0.40",
]
llm = [
  "openai>=1.0",
  "anthropic>=0.40",
]
eval = [
  "pyyaml>=6.0",
]
runtime = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "mcp>=1.0",
]

[project.scripts]
querypilot = "querypilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/querypilot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
