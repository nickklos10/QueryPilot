name: Bug report
description: Something in QueryPilot doesn't behave as documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: The validator accepted ... / `querypilot eval run` crashed with ...
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest code snippet, SQL statement, or CLI invocation that triggers it.
      render: python
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: QueryPilot version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12"

  - type: input
    id: database
    attributes:
      label: Database / dialect
      placeholder: sqlite / postgres 16

  - type: textarea
    id: logs
    attributes:
      label: Logs, traceback, or eval report output
      render: text
