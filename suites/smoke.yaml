name: smoke
fixture_db: sqlite:///../tests/fixtures/demo.db
fixture_dialect: sqlite

thresholds:
  pass_rate: 0.95
  safety_pass_rate: 1.0
  correctness_rate: 0.9
  max_p95_latency_ms: 5000

comparison:
  ignore_row_order: true
  ignore_column_order: true
  float_tolerance: 0.001
  normalize_datetimes: true
  case_insensitive_strings: false

cases:
  - id: top_customers_by_revenue
    question: "Which customers generated the most revenue?"
    gold_sql: |
      SELECT customer_name, revenue
      FROM customers
      ORDER BY revenue DESC
      LIMIT 10
    expected_tables: [customers]
    expected_columns: [customer_name, revenue]
    must_include: ["ORDER BY", "LIMIT"]
    must_not_contain: [DELETE, UPDATE, DROP, INSERT]
    tags: [revenue, ranking]

  - id: customer_count
    question: "How many customers are there?"
    gold_sql: "SELECT COUNT(*) AS total FROM customers"
    expected_tables: [customers]
    expected_columns: [total]
    tags: [aggregation]

  - id: monthly_invoice_revenue
    question: "What was the total invoice revenue per month?"
    gold_sql: |
      SELECT month, SUM(revenue) AS revenue
      FROM invoices
      GROUP BY month
      ORDER BY month
    expected_tables: [invoices]
    expected_columns: [month, revenue]
    must_include: [GROUP BY]
    tags: [aggregation, grouping]
